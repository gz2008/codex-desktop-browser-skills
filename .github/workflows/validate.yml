name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install pyyaml
      - name: Validate skill structure
        run: |
          python .\scripts\validate_skills.py
          python -m py_compile .\skills\c-coursework-verify\scripts\verify_c.py
      - name: Test installer
        shell: powershell
        run: |
          .\install.ps1 -CodexHome "$env:RUNNER_TEMP\codex-home"
